<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeadG2 Points – Internal</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <nav class="topbar">
    <div class="brand">LeadG2 <span>Service Points · Internal</span></div>
    <label class="client-pick">Client <select id="client"></select></label>
    <button id="logout" class="ghost">Sign out</button>
  </nav>
  <div class="wrap">
    <section id="balance" class="stats compact" aria-label="Balance"></section>
    <div class="tabs" role="tablist">
      <button data-tab="review" class="active">Review queue <span id="qcount" class="pill"></span></button>
      <button data-tab="ledger">Ledger</button>
      <button data-tab="entry">Manual entry &amp; import</button>
      <button data-tab="sources">Sources &amp; sync</button>
      <button data-tab="preview">Client preview &amp; access</button>
      <button data-tab="audit">Audit log</button>
    </div>
    <main id="panel"></main>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/staff.js"></script>
</body>
</html>
