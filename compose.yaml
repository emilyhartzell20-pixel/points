# LeadG2 Service Points: production deployment.
#   1. Copy .env.example to .env and fill it in.
#   2. docker compose up -d --build
#   3. docker compose logs app   -> open the one-time admin setup link printed on first start
# Put this behind your HTTPS reverse proxy / load balancer, forwarding to port 3000.
services:
  app:
    build: .
    image: leadg2-points:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:3000:3000"   # reachable only from the reverse proxy on this host
    volumes:
      - leadg2-data:/data       # database + backups. Back this volume up.
volumes:
  leadg2-data:
